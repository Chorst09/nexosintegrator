server {
  listen 80;
  server_name _;

  # Ocultar versão do nginx
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;

  # Bloquear bots e scrapers conhecidos
  if ($http_user_agent ~* (scrapy|curl|wget|python-requests|python-urllib|httpclient|go-http-client|java/|perl|ruby|php/|node|axios|fetch|semrush|ahrefs|mj12bot|dotbot|petalbot|Bytespider|GPTBot|CCBot|Google-Extended|anthropic|ClaudeBot|facebookexternalhit)) {
    return 403;
  }

  # Bloquear requisições diretas ao JS/CSS source maps
  location ~* \.(map)$ {
    return 404;
  }

  # Proxy API via mesma origem (evita depender de porta externa liberada).
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://nexoscrm-backend:3001/api/;
  }

  # Arquivos enviados (uploads) servidos pela API
  location /uploads/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://nexoscrm-backend:3001/uploads/;
  }

  # Servir arquivos estáticos com cache protegido
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1h;
    add_header Cache-Control "public, no-transform";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
