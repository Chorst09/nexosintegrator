<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a5a8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b9bd5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logo-gradient-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b9bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7cb5e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Símbolo Double (dois losangos entrelaçados) - maior -->
  <g transform="translate(15, 15)">
    <!-- Primeiro losango -->
    <path d="M 0 25 L 15 10 L 30 25 L 15 40 Z" fill="url(#logo-gradient-1)" opacity="0.9"/>
    <!-- Segundo losango -->
    <path d="M 15 25 L 30 10 L 45 25 L 30 40 Z" fill="url(#logo-gradient-2)" opacity="0.9"/>
  </g>
  
  <!-- Texto "double" - maior e mais visível -->
  <text x="75" y="48" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#5b9bd5" letter-spacing="2">double</text>
</svg>
