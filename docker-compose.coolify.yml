services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm123
    volumes:
      - coolify_pg_data:/var/lib/postgresql/data
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://crm:crm123@postgres:5432/crm?schema=public
      JWT_SECRET: coolify-local-jwt-secret
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - coolify_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:3002/api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  coolify_pg_data:
  coolify_uploads:
