version: '3.8'

services:
  nexosintegrator:
    image: postgres:15-alpine
    container_name: nexosintegrator
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexoscrm
    volumes:
      - nexoscrm_local_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexoscrm"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nexoscrm_local_data:
